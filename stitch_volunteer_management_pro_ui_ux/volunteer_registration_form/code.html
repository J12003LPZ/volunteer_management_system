<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Volunteer Registration</title>
<!-- Fonts & Icons -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>

                        "on-tertiary-fixed": "#2a1700",

                        "on-primary-fixed-variant": "#003ea8",
                        "primary-container": "#2563eb",
                        "inverse-surface": "#213145",
                        "on-secondary-fixed": "#002113",
                        "on-tertiary-fixed-variant": "#653e00",
                        "on-background": "#0b1c30",
                        "secondary": "#006c49",

                        "secondary-fixed": "#6ffbbe",
                        "inverse-on-surface": "#eaf1ff",

<body class="bg-surface-container-low min-h-screen text-on-surface antialiased flex flex-col justify-center items-center py-12 px-4 sm:px-6 lg:px-8">
<!-- Main Form Container -->
<div class="w-full max-w-3xl bg-surface-container-lowest rounded-xl shadow-[0px_12px_24px_rgba(0,0,0,0.08)] overflow-hidden">
<!-- Header Image Banner -->
<div class="h-48 w-full bg-cover bg-center" data-alt="A bright, welcoming photograph of a diverse group of volunteers working together outdoors in a sunlit park setting. They are smiling and engaged in a community garden project, wearing casual clothes. The lighting is natural and vibrant, evoking a sense of community, teamwork, and positive energy. The color palette features natural greens and warm sunlight, aligning perfectly with a modern, approachable nonprofit brand identity." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBRR7qVhaJ20eX0SJ8OSSw-iSozju6svvlo0yfdfFXhR9Tkqzo7pyw4Lp8N9BqpW2qAdOL3rY5PBZCdhD3b6lBYn0GARC3pQYTuqgc1u4MN108T0qMNh7FsFOVMF1mliTx5_pNvRaD7HrqJbpeAm1tOpvF8NDuMO_PKJI16rdippZcMjOrUrkE5Us2pnVcL1J7NUagI7Xl_qtbHQhoDKoxvlwbm7n3byB4rqYU5vYdsPd5w-kFnr9e5jLhIH6j3HIk6dVYUFu5QofTA');">
</div>
<!-- Form Content -->
<div class="p-8 sm:p-12">
<div class="mb-stack-lg text-center">
<h1 class="font-display-lg text-display-lg text-on-surface mb-2">Join Our Community</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Please fill out the form below to register as a volunteer. We are excited to have you on board!</p>
</div>
<form action="#" class="space-y-stack-lg" method="POST">
<!-- Section 1: Personal Information -->
<div class="border-b border-outline-variant pb-stack-lg">
<h2 class="font-headline-md text-headline-md text-on-surface mb-stack-md flex items-center gap-2">
<span class="material-symbols-outlined text-primary">person</span>
                        Personal Information
                    </h2>
<div class="grid grid-cols-1 gap-y-stack-md gap-x-gutter sm:grid-cols-2">
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-unit uppercase" for="first-name">First Name</label>
<input class="block w-full rounded-DEFAULT border-outline-variant bg-surface font-body-md text-body-md text-on-surface focus:border-primary focus:ring-primary shadow-sm" id="first-name" name="first-name" placeholder="Jane" type="text"/>
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-unit uppercase" for="last-name">Last Name</label>
<input class="block w-full rounded-DEFAULT border-outline-variant bg-surface font-body-md text-body-md text-on-surface focus:border-primary focus:ring-primary shadow-sm" id="last-name" name="last-name" placeholder="Doe" type="text"/>
</div>
<div class="sm:col-span-2">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-unit uppercase" for="email">Email Address</label>
<input class="block w-full rounded-DEFAULT border-outline-variant bg-surface font-body-md text-body-md text-on-surface focus:border-primary focus:ring-primary shadow-sm" id="email" name="email" placeholder="jane.doe@example.com" type="email"/>
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-unit uppercase" for="phone">Phone Number</label>
<input class="block w-full rounded-DEFAULT border-outline-variant bg-surface font-body-md text-body-md text-on-surface focus:border-primary focus:ring-primary shadow-sm" id="phone" name="phone" placeholder="(555) 123-4567" type="tel"/>
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-unit uppercase" for="location">City / Neighborhood</label>
<input class="block w-full rounded-DEFAULT border-outline-variant bg-surface font-body-md text-body-md text-on-surface focus:border-primary focus:ring-primary shadow-sm" id="location" name="location" placeholder="Downtown Area" type="text"/>
</div>
</div>
</div>
<!-- Section 2: Skills & Interests -->
<div class="border-b border-outline-variant pb-stack-lg">
<h2 class="font-headline-md text-headline-md text-on-surface mb-stack-md flex items-center gap-2">
<span class="material-symbols-outlined text-primary">psychology</span>
                        Skills &amp; Interests
                    </h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mb-4">Select all areas where you would like to contribute.</p>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
<label class="relative flex items-start p-4 cursor-pointer rounded-lg border border-outline-variant hover:bg-surface-container transition-colors">
<div class="flex items-center h-5">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline rounded-DEFAULT bg-surface" id="skill-events" name="skills" type="checkbox"/>
</div>
<div class="ml-3 text-sm">
<span class="font-title-sm text-title-sm text-on-surface block">Event Coordination</span>
<span class="font-body-sm text-body-sm text-on-surface-variant block">Help organize and run community events.</span>
</div>
</label>
<label class="relative flex items-start p-4 cursor-pointer rounded-lg border border-outline-variant hover:bg-surface-container transition-colors">
<div class="flex items-center h-5">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline rounded-DEFAULT bg-surface" id="skill-tech" name="skills" type="checkbox"/>
</div>
<div class="ml-3 text-sm">
<span class="font-title-sm text-title-sm text-on-surface block">Tech Support</span>
<span class="font-body-sm text-body-sm text-on-surface-variant block">Assist with IT, website, or data entry tasks.</span>
</div>
</label>
<label class="relative flex items-start p-4 cursor-pointer rounded-lg border border-outline-variant hover:bg-surface-container transition-colors">
<div class="flex items-center h-5">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline rounded-DEFAULT bg-surface" id="skill-outreach" name="skills" type="checkbox"/>
</div>
<div class="ml-3 text-sm">
<span class="font-title-sm text-title-sm text-on-surface block">Community Outreach</span>
<span class="font-body-sm text-body-sm text-on-surface-variant block">Engage with locals and spread awareness.</span>
</div>
</label>
<label class="relative flex items-start p-4 cursor-pointer rounded-lg border border-outline-variant hover:bg-surface-container transition-colors">
<div class="flex items-center h-5">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline rounded-DEFAULT bg-surface" id="skill-admin" name="skills" type="checkbox"/>
</div>
<div class="ml-3 text-sm">
<span class="font-title-sm text-title-sm text-on-surface block">Administrative Support</span>
<span class="font-body-sm text-body-sm text-on-surface-variant block">Help with office tasks and coordination.</span>
</div>
</label>
</div>
</div>
<!-- Section 3: Availability -->
<div class="border-b border-outline-variant pb-stack-lg">
<h2 class="font-headline-md text-headline-md text-on-surface mb-stack-md flex items-center gap-2">
<span class="material-symbols-outlined text-primary">calendar_month</span>
                        Availability
                    </h2>
<div class="mb-4">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2 uppercase">Preferred Days</label>
<div class="flex flex-wrap gap-3">
<label class="inline-flex items-center">
<input class="form-checkbox h-4 w-4 text-primary rounded-DEFAULT border-outline-variant bg-surface focus:ring-primary" type="checkbox"/>
<span class="ml-2 font-body-sm text-body-sm text-on-surface">Weekdays</span>
</label>
<label class="inline-flex items-center">
<input class="form-checkbox h-4 w-4 text-primary rounded-DEFAULT border-outline-variant bg-surface focus:ring-primary" type="checkbox"/>
<span class="ml-2 font-body-sm text-body-sm text-on-surface">Weekends</span>
</label>
</div>
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-unit uppercase" for="time-preference">Preferred Time of Day</label>
<select class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-outline-variant bg-surface focus:outline-none focus:ring-primary focus:border-primary sm:text-sm rounded-DEFAULT font-body-md text-body-md text-on-surface" id="time-preference" name="time-preference">
<option>Mornings (8am - 12pm)</option>
<option>Afternoons (12pm - 4pm)</option>
<option>Evenings (After 4pm)</option>
<option>Flexible</option>
</select>
</div>
</div>
<!-- Section 4: Emergency Contact -->
<div class="border-b border-outline-variant pb-stack-lg">
<h2 class="font-headline-md text-headline-md text-on-surface mb-stack-md flex items-center gap-2">
<span class="material-symbols-outlined text-primary">emergency</span>
                        Emergency Contact
                    </h2>
<div class="grid grid-cols-1 gap-y-stack-md gap-x-gutter sm:grid-cols-2">
<div class="sm:col-span-2">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-unit uppercase" for="ec-name">Full Name</label>
<input class="block w-full rounded-DEFAULT border-outline-variant bg-surface font-body-md text-body-md text-on-surface focus:border-primary focus:ring-primary shadow-sm" id="ec-name" name="ec-name" placeholder="John Doe" type="text"/>
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-unit uppercase" for="ec-relationship">Relationship</label>
<input class="block w-full rounded-DEFAULT border-outline-variant bg-surface font-body-md text-body-md text-on-surface focus:border-primary focus:ring-primary shadow-sm" id="ec-relationship" name="ec-relationship" placeholder="Spouse, Parent, Friend" type="text"/>
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-unit uppercase" for="ec-phone">Phone Number</label>
<input class="block w-full rounded-DEFAULT border-outline-variant bg-surface font-body-md text-body-md text-on-surface focus:border-primary focus:ring-primary shadow-sm" id="ec-phone" name="ec-phone" placeholder="(555) 987-6543" type="tel"/>
</div>
</div>
</div>
<!-- Section 5: Agreement -->
<div>
<div class="flex items-start">
<div class="flex items-center h-5">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded-DEFAULT bg-surface" id="agreement" name="agreement" required="" type="checkbox"/>
</div>
<div class="ml-3 text-sm">
<label class="font-body-sm text-body-sm text-on-surface-variant" for="agreement">
                                I agree to the <a class="text-primary hover:underline font-semibold" href="#">Volunteer Code of Conduct</a> and consent to the processing of my personal data as described in the Privacy Policy.
                            </label>
</div>
</div>
</div>
<!-- Footer: Submit -->
<div class="pt-4 flex justify-end">
<button class="inline-flex justify-center rounded-lg border border-transparent bg-primary py-3 px-8 font-title-sm text-title-sm text-on-primary shadow-sm hover:bg-primary-fixed-variant focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 transition-colors" type="submit">
                        Submit Registration
                    </button>
</div>
</form>
</div>
</div>
</body></html>
