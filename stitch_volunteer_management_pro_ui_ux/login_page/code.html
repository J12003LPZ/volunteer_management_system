<div class="absolute inset-0 z-0">
<img class="w-full h-full object-cover opacity-30 object-center" data-alt="A diverse group of cheerful volunteers actively planting flowers in a vibrant community garden bathed in warm, soft sunlight. The scene embodies a spirit of collaboration, growth, and community engagement. The background is slightly blurred to maintain focus on the act of planting, establishing a positive, welcoming mood that aligns perfectly with a modern, professional light-mode interface." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAnd12gnZ6n7nQy57-R6Uqqp4L0W6la-iWSdLJZU9ftqIUN5tQs-fPAiKacgr9wxKTsrEnOZ5CSv9F6fOuV6-yrakOXw4Nko-_JUv412ZNTJbzqV3wPlcetpoE82kactkuxDnWAiRXVdlfkWnYnYYPrqAHoe3H5HEKB93tPuLTEuN0VKvnn473b6eZicjf2iOn_eKlCnUy0mC51uxcrDYBAaACB4s0xS7U0S1joPJWJgdV65rqTX4RFDhvxOH-qAyBg4sEUvTpsucSj"/>
<div class="absolute inset-0 bg-surface/70 backdrop-blur-[2px] z-10"></div>
</div>
<main class="relative z-20 w-full max-w-md px-container-padding">
<div class="bg-surface-container-lowest rounded-xl p-container-padding shadow-[0px_12px_24px_rgba(0,0,0,0.08)] border border-outline-variant flex flex-col">
<div class="flex flex-col items-center mb-stack-lg text-center">
<div class="w-16 h-16 bg-primary-container rounded-full flex items-center justify-center mb-stack-md text-on-primary-container">
<span class="material-symbols-outlined" data-icon="volunteer_activism" style="font-size: 32px;">volunteer_activism</span>
</div>
<h1 class="font-display-lg text-display-lg text-on-surface mb-unit">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to the Volunteer Management System</p>
</div>
<form class="flex flex-col gap-stack-md">
<div class="flex flex-col gap-stack-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="email">Email Address</label>
<input class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md text-on-surface transition-colors placeholder:text-outline" id="email" placeholder="admin@organization.org" type="email"/>
</div>
<div class="flex flex-col gap-stack-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="password">Password</label>
<input class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md text-on-surface transition-colors placeholder:text-outline" id="password" placeholder="••••••••" type="password"/>
</div>
<div class="flex items-center justify-between mt-unit mb-stack-sm">
<label class="flex items-center gap-unit cursor-pointer group">
<input class="w-4 h-4 rounded text-primary border-outline-variant focus:ring-primary bg-surface transition-colors group-hover:border-primary" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Remember Me</span>
</label>
<a class="font-body-sm text-body-sm text-primary hover:text-on-primary-fixed-variant font-semibold transition-colors" href="#">Forgot Password?</a>
</div>
<button class="w-full py-3 px-4 bg-primary text-on-primary rounded-lg font-title-sm text-title-sm hover:bg-on-primary-fixed-variant focus:ring-4 focus:ring-primary-container transition-colors flex items-center justify-center gap-2 mt-stack-sm" type="submit">
                    Sign In
                    <span class="material-symbols-outlined" data-icon="login" style="font-size: 20px;">login</span>
</button>
</form>
</div>
<div class="mt-stack-lg text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant drop-shadow-sm">
                Need access? <a class="text-primary font-semibold hover:underline" href="#">Contact your administrator</a>
</p>
</div>
</main>
